name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  # Storage tests against a real Postgres. Linux only: service containers
  # don't run on the Windows and macOS runners.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: space_mmo
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: space_mmo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://space_mmo:ci-only-not-secret@localhost:5432/space_mmo
      REQUIRE_DATABASE_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain from rust-toolchain.toml
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - run: cargo test -p server --test store --locked

  # The Avalonia client test, built for each desktop so it can be downloaded
  # and tried. Cross-publishing from Linux keeps this off the costlier runners.
  client-test-avalonia:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [win-x64, osx-arm64, linux-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Check that the generated protobuf client compiles
        run: dotnet build spikes/ProtoCheck -c Release
      - name: Publish
        run: dotnet publish spikes/avalonia -c Release -r ${{ matrix.rid }} --self-contained -o out
      - uses: actions/upload-artifact@v4
        with:
          name: client-test-avalonia-${{ matrix.rid }}
          path: out
          retention-days: 14
